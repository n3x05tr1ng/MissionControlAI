# Hive Desktop — Windows build (NSIS installer)
#
# Tauri can't cross-compile from macOS, so Windows builds run here. The job
# mirrors desktop/scripts/build-desktop.sh: next build (standalone) →
# terminal-runtime (node-pty/better-sqlite3/ws, win32-x64 prebuilds) → bundle
# node.exe as the hive-node sidecar → tauri build with the NSIS bundler.
#
# Trigger manually (workflow_dispatch) or by pushing a tag like desktop-v*.
name: desktop-windows

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install web app deps
        run: npm ci

      - name: Install desktop deps (Tauri CLI)
        run: cd desktop && npm install

      - name: Build desktop app (NSIS)
        env:
          TAURI_BUNDLES: nsis
        run: bash desktop/scripts/build-desktop.sh build

      - name: Smoke check installer exists
        run: ls desktop/src-tauri/target/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hive-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
